id = "dependent_types"
title = "Dependent Types"
topic = "DependentTypes"
description = "Types that depend on values: a vector whose length is part of its type (Vec n a), an index proven in range (Fin n), and pairs whose second part's type depends on the first (Σ types). Full dependent types (Agda, Idris, Lean, Rocq, F*) check these even for values computed at run time; mainstream languages get part of the way with compile-time values in types (Zig comptime, Rust const generics, C static_assert), type-level encodings (TypeScript tuples and brands), or a refinement checked once at the boundary by a smart constructor (parse, don't validate)."
tags = ["dependent-types", "vec-n", "length-indexed", "fin", "sigma-type", "pi-type", "dependent-pair", "refinement-type", "smart-constructor", "parse-dont-validate", "const-generics", "generic-const-exprs", "comptime", "static-assert", "branded-type", "opaque-type", "phantom-type", "bounds-check", "agda", "idris", "lean", "rocq", "coq"]
related_topics = ["type_systems", "trait_and_typeclass_systems", "pattern_matching", "security"]

[[best_practices]]
title = "Parse, don't validate: refine once at the boundary, then trust the type"
explanation = "A validator checks a value and hands back the same unrefined value, so every function downstream has to wonder whether it was checked and many check again. A parser checks once and returns a different, narrower type (Percent instead of int, NonEmpty instead of list) that can only hold values that passed. Functions further in take the narrow type and do no checking at all, because the type is the proof. The check runs once at the edge where untrusted data enters (a request, a file, user input), errors are reported in one place, and the core cannot forget a check it never needed. Alexis King's 'Parse, don't validate' (2019) is the standard statement of the idea."

[[best_practices]]
title = "Make illegal states unrepresentable with indexed types where the language has them"
explanation = "If a function cannot handle an empty vector, give it a type that has no empty value: a NonEmpty tuple in TypeScript, a [T; N] with a compile-time N > 0 check in Rust, a Vec(n) parameter whose n = 0 is a @compileError in Zig. An index into a length-n vector can be a Fin(n), made only by a constructor that refuses i >= n. The impossible case then cannot reach the function at all, so the function needs no check, no error path and no test for it. Yaron Minsky's phrase for this is 'make illegal states unrepresentable'. Where the language cannot put the value in the type, a smart constructor that is the only way to build the value does the same job at run time."

[[best_practices]]
title = "Keep the constructor the only way in"
explanation = "A refined type is only as strong as the weakest way to build one. Hide the representation so the checked constructor is the sole path: a Rust tuple struct with a private field cannot be built outside its module ('cannot initialize a tuple struct which contains private fields'); Go fields starting with a lowercase letter are invisible outside their package; a TypeScript brand is honest only while nothing casts with `as`. Some languages cannot hide it: Zig struct fields are always public, and Cyrius's file-level `private` hides fns and globals but not struct types, so `Percent { 150 }` compiles anywhere. There the rule that only the constructor builds the value has to be enforced by review or a CI grep. Know which of these your language gives you."

[[best_practices]]
title = "Prefer compile-time indices when the sizes are known statically"
explanation = "When the lengths are fixed when the program is written, put them in the type and let the compiler prove the relations. Zig computes types from comptime values, so append(n, m) can return Vec(n + m) directly. Rust's const generics carry N in [T; N]; stable Rust cannot write N + M in a type, but an inline `const { assert!(K == N + M) }` turns a wrong length into a compile error. C's static_assert and Cyrius's #assert check size arithmetic on concrete types. A compile-time check costs nothing at run time and fails before any test runs. Keep run-time refinements for what really is known only at run time: input lengths, parsed numbers, user data."

[[gotchas]]
title = "A phantom type is not a dependent type"
explanation = "A phantom type parameter (Rust's PhantomData<N>, or a TypeScript N kept in an optional property that is never set) labels a value with a type, but nothing ties the label to the data: the compiler checks that labels match each other, never that the label is true. A TypeScript N used nowhere in the type is not even compared, because TypeScript types are structural: a Vec<3> is then assignable to a Vec<4>. Below, a Vec<3> holds one element and compiles cleanly. A dependent type, or its nearest encoding, puts the length in the data's own type: a TypeScript tuple type [number, number, number] has exactly three slots, and `[1]` is refused with TS2322. Use phantoms for units or states that a constructor sets; do not mistake them for a proof about the contents."
bad_example = "type Vec<N extends number> = { readonly items: readonly number[]; readonly len?: N };\nconst v: Vec<3> = { items: [1] };   // compiles: the label says 3, the data holds 1"
good_example = "type Vec3 = readonly [number, number, number];\nconst v: Vec3 = [1];   // error TS2322: Type '[number]' is not assignable to type 'Vec3'"
language = "TypeScript"

[[gotchas]]
title = "One escape hatch undoes a refinement that nothing re-checks"
explanation = "A refinement is checked once so that downstream code can skip the check. That is also why a single bypass is enough to break it: whatever skips the constructor (a TypeScript `as`, a struct literal, a cast, a raw store into the value) produces a value that every later function trusts. Below, a Percent of 150 is built with a struct literal and discount happily returns a negative price, -100. The cyrius.cyr example runs exactly this, and also shows a store64 rewriting an already validated Percent. Close the hatches the language lets you close (private fields, module boundaries, read-only values), and search for the ones it does not (`as Percent`, `Percent {`) in review."
bad_example = "var forged = Percent { 150 };          # the struct literal never meets percent()\ndiscount(200, &forged);                # -100: discount trusts its argument"
good_example = "var p = percent(150);                  # the constructor refuses it: p == 0\nif (p != 0) { discount(200, p); }      # only a checked Percent reaches discount"

[[gotchas]]
title = "Rust const-generic arithmetic (N + M in a type) is unstable"
explanation = "Const generics let a Rust type carry a number, [i64; N], but stable Rust allows a const parameter only as a standalone argument. An expression over parameters in a type, such as the N + M that append's return type needs, requires the unstable generic_const_exprs feature, and stable rustc refuses it. The stable workaround takes the result length as a third parameter K, chosen by the caller's annotation, and proves K == N + M with an inline const block, which is evaluated for each instantiation: a wrong K becomes a compile error (E0080). The same trick gives head a compile-time refusal of the empty array: `const { assert!(N > 0) }`."
bad_example = "fn append<const N: usize, const M: usize>(a: [i64; N], b: [i64; M]) -> [i64; N + M] { todo!() }\n// error: generic parameters may not be used in const operations"
good_example = "fn append<const N: usize, const M: usize, const K: usize>(a: [i64; N], b: [i64; M]) -> [i64; K] {\n    const { assert!(K == N + M, \"append: K must be N + M\") };\n    let mut out = [0; K];\n    out[..N].copy_from_slice(&a);\n    out[N..].copy_from_slice(&b);\n    out\n}\nlet c: [i64; 5] = append([1, 2], [3, 4, 5]);   // [i64; 4] here: error[E0080]: evaluation panicked: append: K must be N + M"
language = "Rust"

[[gotchas]]
title = "Zig comptime values are compile-time only, so a run-time length needs a different type"
explanation = "Zig's comptime is the strongest of these encodings: fn Vec(comptime n: usize) type builds a distinct type per length, and append can return Vec(n + m). But the n must be known when the program is compiled. A length read from input, a file or a computation at run time cannot be passed to a comptime parameter, and the compiler says so. Data whose size is decided at run time needs a run-time representation, a slice ([]i64) or a struct carrying its length, refined by a checked constructor instead of by the type."
bad_example = "var n: usize = readLength();\nconst V = Vec(n);   // error: unable to resolve comptime value (argument to comptime parameter must be comptime-known)"
good_example = "const Items = struct { items: []const i64 };   // length is a run-time value\nfn nonEmpty(items: []const i64) ?Items {\n    return if (items.len == 0) null else Items{ .items = items };\n}"
language = "Zig"

[[performance_notes]]
title = "An index proven in range can drop the bounds check, if the proof reaches the optimizer"
explanation = "A bounds check on every access is the cost of not knowing that the index is in range. An index the compiler can see is constant needs no check, and neither does one whose range the optimizer has been told. A Fin type proves the range to the programmer, but a plain Fin is opaque to the optimizer: it sees a usize loaded from a struct, not the constructor's i < N. The check disappears only when the invariant is stated where codegen can use it (Rust's core::hint::assert_unchecked in the accessor, sound because the constructor is the only way in) or when the index is a constant."
evidence = "Measured with rustc 1.99.1 -C opt-level=3 --emit asm on x86_64, indexing a [i64; 8]: by a runtime usize, 9 instructions including a call to panic_bounds_check (cmpq $7 / ja); by the constant 3, 2 instructions and no check; by a Fin<8> with a plain accessor, the same 9 instructions with the check; by a Fin<8> whose accessor calls assert_unchecked(self.0 < N), 2 instructions (movq (%rdi,%rsi,8), %rax; retq) and no check."

[[performance_notes]]
title = "A refinement is checked once at the boundary instead of at every use"
explanation = "Validating where data enters and passing a refined type inward turns k checks along a pipeline into one. For an O(1) predicate such as a range check, that saves k - 1 comparisons and, more importantly, the k - 1 places a check could be forgotten. For an O(n) predicate (all elements positive, a list is sorted, a string is valid UTF-8) the saving is real time: one O(n) pass at the boundary instead of k passes, so O(n) instead of O(k n)."
evidence = "Computed: k uses of a value with an O(n) predicate cost O(k n) when each use re-validates and O(n) + O(k) when it is refined once. The cyrius.cyr example counts it: 5 constructions run the Percent range check 5 times, and 3 discount calls afterwards add 0."

[[performance_notes]]
title = "Compile-time lengths cost nothing at run time"
explanation = "When the length is part of the type it does not have to be stored or checked: the value is just its elements. A run-time length needs a length field (and usually a capacity and a pointer to a separate buffer), plus a comparison on each checked access. Zig's comptime sizes and Rust's [T; N] are laid out exactly as N elements; so is a Cyrius struct per length. The trade-off is flexibility: every distinct length is a distinct type and, for generic code, a separate instantiation."
evidence = "Measured: Zig 0.17 @sizeOf(Vec(3)) = 24 bytes and @sizeOf(Vec(0)) = 0 for a struct { items: [n]i64 }, against 16 bytes for a []i64 slice header before any elements. Cyrius 6.7.18: sizeof(Vec3) = 24 bytes, against 152 bytes allocated for a lib/vec.cyr vec holding the same 3 elements (a 24-byte header plus a 16-slot buffer), whose vec_get also compares the index on every access."
