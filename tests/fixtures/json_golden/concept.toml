# Fixture for tests/vidya.tcyr — golden output for the json_*_response
# builders. Deliberately plain ASCII so the exact-string goldens in the
# test stay legible; hostile bytes live in ../json_hostile.
#
# The section counts are 3 / 2 / 4 — distinct from each other and none
# equal to 1, so both the 2.8.1 /info bug (`v != 0 && vec_len(v)`
# collapsing every count to a boolean) and a transposed field fail loudly.
#
# Only python.py ships alongside, so `languages` is a single-element
# array and /gaps reports 10 missing. Adding a language file here means
# updating the goldens in tests/vidya.tcyr.
