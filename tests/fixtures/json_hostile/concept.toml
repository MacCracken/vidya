# Fixture for tests/vidya.tcyr — content-derived bytes that must be
# JSON-escaped on the way out. No concept in content/ carries a bare
# quote or backslash today, which is the only reason the unescaped
# splices in json_info_response / json_compare_response were latent
# rather than broken. This fixture removes that luck from the test bed.
#
# Triple-quoted literal strings: bayan's TOML reader hands back the body
# verbatim with no escape expansion, so `description` really does arrive
# carrying a bare `"` and a bare `\`.
id = "json_hostile"
title = '''hostile "title"'''
topic = "Testing"
description = '''q:" b:\ end'''
tags = ["back\slash"]
