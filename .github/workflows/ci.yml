name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      # Action majors bumped at vidya 2.8.4 (checkout v4 → v7,
      # upload-artifact v4 → v7, download-artifact v4 → v8,
      # action-gh-release v2 → v3). Every one of those majors is a Node 20 →
      # Node 24 runtime move requiring Actions Runner ≥ 2.327.1, which
      # GitHub-hosted `ubuntu-latest` satisfies. Checked for real breakage
      # rather than assumed:
      #   - download-artifact v5's BREAKING path change applies to
      #     `artifact-ids:` (by ID) only; release.yml downloads by `name:`,
      #     which upstream's own migration guide lists under "no action
      #     needed".
      #   - upload-artifact v7's new `archive:` input is opt-in, and
      #     multi-file globs with an explicit `name:` are unchanged.
      #   - action-gh-release v3 is a pure runtime move; v2.6.2 is the last
      #     Node 20 line if a self-hosted runner ever needs it.
      # ⚠ The rest of AGNOS (sit, hoosh, vyakarana, sakshi, sandhi) was still
      # on v4/v2 as of 2026-08-22 — vidya is deliberately ahead here, not
      # accidentally divergent. cyrius pins actions by full commit SHA
      # instead, which is the stronger pattern if this ever needs hardening.
      - uses: actions/checkout@v7

      - name: Install Cyrius toolchain
        # Consumer pattern (sit / sigil / sandhi): pipe the
        # upstream install.sh which lays out $HOME/.cyrius/versions/$VER/
        # {bin,lib}, the flat $HOME/.cyrius/{bin,lib} symlinks, and the
        # $HOME/.cyrius/current pointer. The version comes from the
        # `cyrius = "..."` pin in cyrius.cyml, so CI installs exactly the
        # toolchain the manifest declares.
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="${CYRIUS_VERSION}" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        # Two-step, both pin-aware:
        #   1. `cyrius lib sync` vendors the `[deps] stdlib` subset from the
        #      snapshot named by `cyrius = "..."` in cyrius.cyml. The former
        #      `cp -rL "$HOME/.cyrius/lib/"*` copied the FLAT symlink dir
        #      (whatever the wrapper currently points at) and staged the whole
        #      101-module snapshot, producing a 109-entry lock where a
        #      developer's produces 62.
        #   2. `cyrius deps` resolves the [deps.<name>] git deps (vyakarana).
        #      sakshi is NOT one — it is folded into the stdlib snapshot as of
        #      cyrius 6.5.24 and is declared in `[deps] stdlib`. See the ⚠ note
        #      in cyrius.cyml: a git block there shadow-overrides the folded
        #      module and silently downgrades it.
        # cyrius.lock is gitignored (a build artifact); no verify step.
        run: |
          cyrius lib sync
          cyrius deps

      - name: Lint
        # Per-file in 5.7+. The cosmetic 'exceeds 120 characters' warning
        # is tolerated; everything else hard-fails. Mirrors sit's pattern.
        run: |
          fail=0
          for f in src/*.cyr; do
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            bad=$(echo "$out" | grep -E '^\s*(warn|error)|^error:' | grep -v 'exceeds 120 characters' || true)
            if [ -n "$bad" ]; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: non-cosmetic warnings present"; exit 1; }

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/vidya
          echo "vidya: $(wc -c < build/vidya) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/vidya | grep -q "7f45 4c46"

      - name: Smoke test
        run: |
          ./build/vidya stats
          ./build/vidya search string
          ./build/vidya info strings | head -5
          ./build/vidya languages
          ./build/vidya gaps

      - name: Test (.tcyr)
        # NOT continue-on-error. It was, through 2.8.0 — and release.yml
        # `needs: [ci]` without re-running tests, so a fully red suite could
        # still tag a release. `cyrius test` does exit non-zero on a failed
        # assertion. Neither sit nor hoosh suppresses this anywhere.
        run: cyrius test

      - name: Bench (.bcyr)
        # No-arg discovery of tests/*.bcyr broke in 6.4.x and was fixed in
        # 6.5.x; the explicit path works either side, so keep it.
        # continue-on-error is deliberate HERE (unlike the test step above):
        # vidya.bcyr asserts nothing, and timings flake on shared runners.
        run: cyrius bench tests/vidya.bcyr
        continue-on-error: true

  content:
    name: Content Validation
    runs-on: ubuntu-latest
    # The corpus targets each language's latest release (docs/sources.md), and
    # the dev host is Arch Linux. ubuntu-24.04's stock toolchains lag far
    # behind (GCC 13, Python 3.12), and GCC 16 has no apt build for it, so the
    # content gate runs in an Arch container. pacman gives it the same GCC, Go,
    # Node, Zig, binutils and QEMU as the dev host. Versions float with Arch, as
    # they do on the host. The first step prints every one, so a break that a
    # new upstream release causes can be attributed.
    container: archlinux:latest
    steps:
      - name: Install toolchains (pacman)
        # git first: actions/checkout needs it inside the container.
        run: |
          pacman -Syu --noconfirm --needed \
            git base-devel curl tar xz which \
            python python-pip uv go nodejs npm zig rustup \
            aarch64-linux-gnu-binutils qemu-user

      - uses: actions/checkout@v7

      - name: Verify the content layout
        # Since 3.0.0: content/<group>/ holds a group.toml, and each topic is
        # content/<group>/<topic>/ with a concept.toml. The loader reads
        # nothing else, so a concept.toml anywhere else would vanish
        # silently. `cyrius test` checks the same rules (content_layout).
        run: |
          FAIL=0
          for d in content/*/; do
            d=${d%/}
            if [ ! -f "$d/group.toml" ]; then
              echo "MISSING: $d/group.toml"
              FAIL=1
            else
              for field in id title description order; do
                if ! grep -q "^$field = " "$d/group.toml"; then
                  echo "MISSING: $d/group.toml: $field"
                  FAIL=1
                fi
              done
              if ! grep -qx "id = \"${d#content/}\"" "$d/group.toml"; then
                echo "WRONG ID: $d/group.toml must say id = \"${d#content/}\""
                FAIL=1
              fi
            fi
            if [ -f "$d/concept.toml" ]; then
              echo "STRAY: $d/concept.toml (topics live at content/<group>/<topic>/)"
              FAIL=1
            fi
          done
          exit $FAIL

      - name: Check required fields
        run: |
          FAIL=0
          for f in content/*/*/concept.toml; do
            topic=$(dirname "$f"); topic=${topic#content/}
            for field in id title description tags; do
              if ! grep -q "^$field " "$f" 2>/dev/null; then
                echo "MISSING: $topic concept.toml: $field"
                FAIL=1
              fi
            done
            # The id is the path (3.0.0); the loader refuses any other.
            if ! grep -qx "id = \"$topic\"" "$f"; then
              echo "WRONG ID: $f must say id = \"$topic\""
              FAIL=1
            fi
          done
          exit $FAIL

      # ── Toolchains pacman does not cover ──────────────────────────────
      - name: Install Rust (rustup stable)
        # Arch's `rust` package trails stable by a release or two; rustup
        # tracks it.
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install Python 3.15 (uv)
        # The corpus targets Python 3.15; Arch still packages 3.14. The gate
        # takes the interpreter from VIDYA_PYTHON (set on the validate step)
        # and, under VIDYA_STRICT, refuses an older one.
        run: |
          uv python install 3.15
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install tsc + tsx + @types/node
        # tsx RUNS TypeScript; it strips types and never checks them. The
        # content gate type-checks with tsc as well, which needs both the
        # compiler and @types/node. Without them the TypeScript step SKIPS,
        # and VIDYA_STRICT=1 turns that skip into a failure.
        run: npm install -g typescript tsx @types/node

      - name: Install qiskit (OpenQASM 3 validator)
        # scripts/qasm_check.py loads each circuit with qiskit's OpenQASM 3
        # importer (qiskit-qasm3-import) and runs its `// @expect` lines on
        # qiskit-aer. The gate prefers .venv/bin/python3 for OpenQASM.
        run: |
          python -m venv .venv
          .venv/bin/pip install --no-cache-dir qiskit qiskit-qasm3-import qiskit-aer

      - name: Install Cyrius toolchain
        # content validation needs `cyrius run` for cyrius.cyr examples.
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="${CYRIUS_VERSION}" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"

      - name: Rehydrate lib/ for content cyrius.cyr examples
        # `cyrius run content/<topic>/cyrius.cyr` walks up to find vidya's
        # cyrius.cyml and resolves `[deps] stdlib` against `./lib/*.cyr`.
        run: |
          cyrius lib sync
          cyrius deps

      - name: Toolchain versions
        # One place that says what this run validated against.
        run: |
          rustc --version
          python3.15 --version
          gcc --version | head -1
          go version
          node --version
          "$(npm root -g)/typescript/bin/tsc" --version
          npx tsx --version | head -1
          bash --version | head -1
          zig version
          as --version | head -1
          aarch64-linux-gnu-as --version | head -1
          qemu-aarch64 --version | head -1
          .venv/bin/python3 -c "import qiskit, qiskit_aer, qiskit_qasm3_import as q3; print('qiskit', qiskit.__version__, 'aer', qiskit_aer.__version__, 'qasm3-import', q3.__version__)"
          cyrius version

      - name: Validate all examples compile/run
        # The gate per CLAUDE.md "Content Standards": every concept.toml
        # example must compile and run in its language.
        #
        # VIDYA_STRICT=1: every toolchain IS installed above, so a skip means
        # a probe broke, not a missing tool. Through 2.8.0 the qemu probe
        # looked only for `qemu-aarch64` while qemu-user-static ships
        # `qemu-aarch64-static`, so all 77 AArch64 examples were skipped on
        # every run and the gate still reported green on 770/847.
        env:
          VIDYA_STRICT: "1"
          VIDYA_PYTHON: python3.15
        run: bash scripts/validate-content.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan for dangerous patterns
        run: |
          WARN=0
          if grep -rn 'syscall(59' src/ 2>/dev/null | grep -v "# "; then
            echo "WARN: raw execve in src/"; WARN=1
          fi
          echo "security scan complete (warnings: $WARN)"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -q "$VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
