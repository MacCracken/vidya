name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Cyrius toolchain
        # Consumer pattern (sit / sigil / sandhi): pipe the
        # upstream install.sh which lays out $HOME/.cyrius/versions/$VER/
        # {bin,lib}, the flat $HOME/.cyrius/{bin,lib} symlinks, and the
        # $HOME/.cyrius/current pointer. The version comes from the
        # `cyrius = "..."` pin in cyrius.cyml, so CI installs exactly the
        # toolchain the manifest declares.
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="${CYRIUS_VERSION}" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"

      - name: Resolve dependencies
        # Two-step, both pin-aware:
        #   1. `cyrius lib sync` vendors the `[deps] stdlib` subset from the
        #      snapshot named by `cyrius = "..."` in cyrius.cyml. The former
        #      `cp -rL "$HOME/.cyrius/lib/"*` copied the FLAT symlink dir
        #      (whatever the wrapper currently points at) and staged the whole
        #      101-module snapshot, producing a 109-entry lock where a
        #      developer's produces 62.
        #   2. `cyrius deps` resolves the [deps.<name>] git deps (vyakarana).
        #      sakshi is NOT one — it is folded into the stdlib snapshot as of
        #      cyrius 6.5.24 and is declared in `[deps] stdlib`. See the ⚠ note
        #      in cyrius.cyml: a git block there shadow-overrides the folded
        #      module and silently downgrades it.
        # cyrius.lock is gitignored (a build artifact); no verify step.
        run: |
          cyrius lib sync
          cyrius deps

      - name: Lint
        # Per-file in 5.7+. The cosmetic 'exceeds 120 characters' warning
        # is tolerated; everything else hard-fails. Mirrors sit's pattern.
        run: |
          fail=0
          for f in src/*.cyr; do
            out=$(cyrius lint "$f" 2>&1 || true)
            echo "$out"
            bad=$(echo "$out" | grep -E '^\s*(warn|error)|^error:' | grep -v 'exceeds 120 characters' || true)
            if [ -n "$bad" ]; then
              fail=1
            fi
          done
          [ $fail -eq 0 ] || { echo "lint: non-cosmetic warnings present"; exit 1; }

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/vidya
          echo "vidya: $(wc -c < build/vidya) bytes"

      - name: Verify ELF
        run: xxd -l 4 build/vidya | grep -q "7f45 4c46"

      - name: Smoke test
        run: |
          ./build/vidya stats
          ./build/vidya search string
          ./build/vidya info strings | head -5
          ./build/vidya languages
          ./build/vidya gaps

      - name: Test (.tcyr)
        # NOT continue-on-error. It was, through 2.8.0 — and release.yml
        # `needs: [ci]` without re-running tests, so a fully red suite could
        # still tag a release. `cyrius test` does exit non-zero on a failed
        # assertion. Neither sit nor hoosh suppresses this anywhere.
        run: cyrius test

      - name: Bench (.bcyr)
        # No-arg discovery of tests/*.bcyr broke in 6.4.x and was fixed in
        # 6.5.x; the explicit path works either side, so keep it.
        # continue-on-error is deliberate HERE (unlike the test step above):
        # vidya.bcyr asserts nothing, and timings flake on shared runners.
        run: cyrius bench tests/vidya.bcyr
        continue-on-error: true

  content:
    name: Content Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify concept.toml in topic directories
        run: |
          MISSING=0
          for d in content/*/; do
            [ -d "$d" ] || continue
            name=$(basename "$d")
            # Skip non-topic directories (language reference, shared files)
            case "$name" in cyrius) continue ;; esac
            if [ ! -f "$d/concept.toml" ]; then
              echo "MISSING: $d/concept.toml"
              MISSING=1
            fi
          done
          exit $MISSING

      - name: Check required fields
        run: |
          FAIL=0
          for f in content/*/concept.toml; do
            topic=$(dirname "$f" | xargs basename)
            for field in id title topic description tags; do
              if ! grep -q "^$field " "$f" 2>/dev/null; then
                echo "MISSING: $topic concept.toml: $field"
                FAIL=1
              fi
            done
          done
          exit $FAIL

      # ── Install per-language toolchains for validate-content.sh ───────
      # rustc / python3 / gcc / go / node are preinstalled on
      # ubuntu-latest. zig, aarch64 binutils, qemu-user-static, tsx,
      # qiskit, and cyrius need explicit setup. validate-content.sh
      # gracefully skips any language whose toolchain is absent, but CI
      # is the place to gate every example — install all of them.
      - name: Install zig
        # Tracks the current Zig language release (0.16.x) per
        # docs/sources.md, docs/development/content-format.md, and
        # README.md. content/*/zig.zig was migrated to 0.16 at vidya
        # 2.7.2: `std.heap.DebugAllocator`, the `std.Io` interface
        # (Threaded backend) threading through fs / Mutex / random, and
        # the `std.Io.Writer` ("Writergate") API. Not compatible with 0.15.
        run: |
          ZIG_VER="0.16.0"
          curl -sSL -o /tmp/zig.tar.xz \
            "https://ziglang.org/download/${ZIG_VER}/zig-x86_64-linux-${ZIG_VER}.tar.xz"
          mkdir -p /opt/zig && tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"

      - name: Install aarch64 cross-tools + qemu-user-static
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            binutils-aarch64-linux-gnu \
            qemu-user-static

      - name: Install tsx (TypeScript runner)
        run: npm install -g tsx

      - name: Install qiskit (OpenQASM validator)
        run: pip install --no-cache-dir qiskit

      - name: Install Cyrius toolchain
        # Same pattern as the build-and-test job — content validation
        # needs `cyrius run` for cyrius.cyr examples.
        run: |
          CYRIUS_VERSION="${CYRIUS_VERSION:-$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')}"
          echo "Installing Cyrius $CYRIUS_VERSION"
          curl -sSf https://raw.githubusercontent.com/MacCracken/cyrius/main/scripts/install.sh | \
            CYRIUS_VERSION="${CYRIUS_VERSION}" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"
          echo "CYRIUS_HOME=$HOME/.cyrius" >> "$GITHUB_ENV"

      - name: Rehydrate lib/ for content cyrius.cyr examples
        # `cyrius run content/<topic>/cyrius.cyr` walks up to find vidya's
        # cyrius.cyml and resolves `[deps] stdlib` against `./lib/*.cyr`.
        # Without rehydration, every per-topic cyrius.cyr fails with
        # "cannot read ./lib/<module>.cyr". Same two-step as build-and-test.
        run: |
          cyrius lib sync
          cyrius deps

      - name: Validate all examples compile/run
        # The gate per CLAUDE.md "Content Standards" — every concept.toml
        # example must compile and run successfully in its language.
        # ~10 min wallclock for 847 examples across 11 languages.
        #
        # VIDYA_STRICT=1: every toolchain IS installed above, so a skip means
        # a probe broke, not a missing tool. Through 2.8.0 the qemu probe
        # looked only for `qemu-aarch64` while qemu-user-static ships
        # `qemu-aarch64-static` — all 77 AArch64 examples were skipped on
        # every run and the gate still reported green on 770/847.
        env:
          VIDYA_STRICT: "1"
        run: bash scripts/validate-content.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan for dangerous patterns
        run: |
          WARN=0
          if grep -rn 'syscall(59' src/ 2>/dev/null | grep -v "# "; then
            echo "WARN: raw execve in src/"; WARN=1
          fi
          echo "security scan complete (warnings: $WARN)"

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files
        run: |
          MISSING=0
          for f in README.md CHANGELOG.md VERSION CONTRIBUTING.md SECURITY.md LICENSE cyrius.cyml; do
            if [ -f "$f" ]; then echo "  OK: $f"
            else echo "  MISSING: $f"; MISSING=1; fi
          done
          exit $MISSING
      - name: Verify version consistency
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          echo "VERSION file: $VERSION"
          grep -q "$VERSION" CHANGELOG.md || { echo "FAIL: version not in CHANGELOG.md"; exit 1; }
          echo "Version consistent (manifest pulls VERSION via \${file:VERSION})"
